<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parking Risk Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <main class="app">
    <aside class="panel">
      <div class="panelHeader">
        <div class="brandBlock">
          <div class="titleBlock">
            <h1>Parking Risk Viewer</h1>
            <span id="buildVersion" class="versionText">v1.0.0</span>
          </div>
          <div class="githubMeta">
            <a
              class="githubLink"
              href="https://github.com/DanielZenFlow/AIMS-Level-Viewer"
              target="_blank"
              rel="noreferrer"
              aria-label="Parking Risk Viewer on GitHub"
            >
              <svg class="githubMark" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
              </svg>
              <span>By DanielZenFlow</span>
            </a>
          </div>
        </div>
      </div>

      <label class="filePick">
        <input id="fileInput" type="file" accept=".lvl,text/plain">
        Load &amp; Compute
      </label>
      <label class="filePick secondaryPick">
        <input id="directoryInput" type="file" accept=".lvl,text/plain" webkitdirectory directory multiple>
        Add directory
      </label>

      <div id="meta" class="meta">No report loaded</div>

      <section class="levelLibraryPanel">
        <div class="sectionTitleRow">
          <h2>Levels</h2>
          <div class="levelTitleActions">
            <button id="prevLevelBtn" class="miniButton levelNavBtn" type="button" title="Previous level" aria-label="Previous level">&uarr;</button>
            <button id="nextLevelBtn" class="miniButton levelNavBtn" type="button" title="Next level" aria-label="Next level">&darr;</button>
            <button id="clearLibraryBtn" class="miniButton" type="button">Clear</button>
          </div>
        </div>
        <label class="searchLabel compactSearch">Filter levels
          <input id="levelSearchInput" placeholder="name, folder, path">
        </label>
        <div id="libraryInfo" class="miniInfo">Add a directory to list .lvl files here.</div>
        <div id="levelList" class="levelList"></div>
      </section>

      <section class="controls">
        <h2>Layers</h2>
        <label><input type="checkbox" id="showSafe" checked> Safe cells</label>
        <label><input type="checkbox" id="showCaution" checked> Caution cells</label>
        <label><input type="checkbox" id="showDanger" checked> Danger cells</label>
        <label><input type="checkbox" id="showGoals" checked> Goals</label>
        <label><input type="checkbox" id="showObjects" checked> Initial boxes and agents</label>
      </section>

      <section class="legend">
        <div><span class="swatch safe"></span>Safe candidate</div>
        <div><span class="swatch caution"></span>Caution: current door or corner</div>
        <div><span class="swatch danger"></span>Danger: static door</div>
        <div><span class="swatch danger"></span>Occupied door/blocker or gate</div>
        <div><span class="swatch goal"></span>Goal cell: no parking</div>
      </section>
    </aside>

    <section class="boardWrap">
      <div class="toolbar">
        <button id="togglePanel" class="toolbarBtn" title="Hide / show sidebar">&laquo;</button>
        <span id="hoverInfo">Hover a cell</span>
      </div>
      <div id="boards" class="boards">
        <div id="axisCorner" class="axisCorner"></div>
        <div id="axisTop" class="axisTop"><div id="axisTopInner" class="axisInner"></div></div>
        <div id="axisLeft" class="axisLeft"><div id="axisLeftInner" class="axisInner"></div></div>
        <div id="panViewport" class="panViewport">
          <div id="panSurface" class="panSurface"></div>
        </div>
        <div id="hoverTip" class="hoverTip"></div>
      </div>
      <div class="statusBar">
        <span id="zoomInfo" class="statusInfo">100%</span>
        <button id="resetView" class="toolbarBtn" type="button" title="Reset view" aria-label="Reset view">&#8857;</button>
      </div>
    </section>

    <div id="notificationToast" class="notificationToast" role="alert" hidden>
      <div>
        <strong id="notificationTitle">Something needs attention</strong>
        <p id="notificationMessage"></p>
      </div>
      <button id="notificationCloseBtn" type="button" aria-label="Dismiss message">x</button>
    </div>
  </main>
  <script src="parking-risk-data.js"></script>
  <script src="parking-risk-manifest.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
