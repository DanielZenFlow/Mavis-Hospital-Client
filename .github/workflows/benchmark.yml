name: Run Batch Benchmark

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'src/**'
      - 'complevels/**'
      - 'complevels26/**'
      - 'run_benchmark.py'
      - '.github/workflows/benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - level-dir: complevels
            output-file: benchmark_results.md
            artifact-name: benchmark-results-complevels
          - level-dir: complevels26
            output-file: benchmark_results_complevels26.md
            artifact-name: benchmark-results-complevels26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean compile

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Server Jar Exists
        run: |
          if [ ! -f server.jar ]; then
            echo "server.jar not found at root! Ensure it is committed."
            exit 1
          fi

      - name: Run Python Benchmark Script
        id: benchmark
        continue-on-error: true
        env:
          LEVEL_DIR: ${{ matrix.level-dir }}
          OUTPUT_FILE: ${{ matrix.output-file }}
        run: |
          set +e
          python run_benchmark.py
          status=$?
          set -e
          echo "Exit code: $status"
          ls -la "$OUTPUT_FILE" || echo "$OUTPUT_FILE not found"
          exit "$status"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if some tests fail
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.output-file }}
            *.log
          if-no-files-found: warn
